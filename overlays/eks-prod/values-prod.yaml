namespace: ecommerce
imagePullPolicy: IfNotPresent

config:
  dbHost: postgres
  dbPort: "5432"
  dbName: auraweb_db
  dbUser: auraweb_user
  redisHost: redis
  redisUrl: redis://redis:6379
  rabbitmqUrl: amqp://rabbitmq:5672
  logLevel: info
  awsRegion: us-west-1
  s3BucketName: ecommerce-prod-bucket

secret:
  dbPassword: CHANGE_ME_DB_PASSWORD
  jwtSecret: CHANGE_ME_ACCESS_SECRET
  jwtRefreshSecret: CHANGE_ME_REFRESH_SECRET
  awsAccessKeyId: CHANGE_ME
  awsSecretAccessKey: CHANGE_ME

topologySpread:
  enabled: true
  topologyKey: topology.kubernetes.io/zone

storageClass:
  create: true
  name: gp3-wait
  provisioner: ebs.csi.aws.com
  type: gp3

stateful:
  postgres:
    enabled: true
    image: postgres:16-alpine
    replicas: 1
    port: 5432
    storage: 10Gi
    storageClassName: gp3-wait
  redis:
    enabled: true
    image: redis/redis-stack-server:latest
    replicas: 1
    port: 6379
    storage: 5Gi
    storageClassName: gp3-wait
  rabbitmq:
    enabled: true
    image: rabbitmq:3-management-alpine
    replicas: 1
    port: 5672
    managementPort: 15672
    storage: 5Gi
    storageClassName: gp3-wait

services:
  user-auth:
    image: 123456789012.dkr.ecr.us-west-1.amazonaws.com/ecommerce-user-auth:v1.0.0
    port: 3000
    replicas: 2
    healthPath: /health
    resources:
      requests:
        cpu: 150m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  catalog:
    image: 123456789012.dkr.ecr.us-west-1.amazonaws.com/ecommerce-catalog:v1.0.0
    port: 3001
    replicas: 2
    healthPath: /health
    resources:
      requests:
        cpu: 150m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  order-payment:
    image: 123456789012.dkr.ecr.us-west-1.amazonaws.com/ecommerce-order-payment:v1.0.0
    port: 3002
    replicas: 2
    healthPath: /health
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 400m
        memory: 512Mi

  fulfillment:
    image: 123456789012.dkr.ecr.us-west-1.amazonaws.com/ecommerce-fulfillment:v1.0.0
    port: 3003
    replicas: 2
    healthPath: /health
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 400m
        memory: 512Mi

  shopping:
    image: 123456789012.dkr.ecr.us-west-1.amazonaws.com/ecommerce-shopping:v1.0.0
    port: 3004
    replicas: 2
    healthPath: /health
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 400m
        memory: 512Mi

  platform:
    image: 123456789012.dkr.ecr.us-west-1.amazonaws.com/ecommerce-platform:v1.0.0
    port: 3005
    replicas: 2
    healthPath: /health
    resources:
      requests:
        cpu: 150m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  inventory:
    image: 123456789012.dkr.ecr.us-west-1.amazonaws.com/ecommerce-inventory:v1.0.0
    port: 3006
    replicas: 2
    healthPath: /health
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 400m
        memory: 512Mi

  frontend:
    image: 123456789012.dkr.ecr.us-west-1.amazonaws.com/ecommerce-frontend:v1.0.0
    port: 8080
    replicas: 2
    healthPath: /
    resources:
      requests:
        cpu: 80m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi

  admin:
    image: 123456789012.dkr.ecr.us-west-1.amazonaws.com/ecommerce-admin:v1.0.0
    port: 8080
    replicas: 2
    healthPath: /
    resources:
      requests:
        cpu: 80m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi

  gateway:
    image: 123456789012.dkr.ecr.us-west-1.amazonaws.com/ecommerce-gateway:v1.0.0
    port: 8080
    replicas: 3
    healthPath: /health
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 400m
        memory: 256Mi

ingress:
  enabled: true
  className: alb
  host: ecommerce.example.com
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /health

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  cpuUtilization: 70
