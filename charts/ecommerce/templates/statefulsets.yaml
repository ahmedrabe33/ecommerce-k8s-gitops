  selector:
    app: redis
  ports:
    - port: {{ .Values.stateful.redis.port }}
      targetPort: {{ .Values.stateful.redis.port }}
{{- end }}

---
{{- if .Values.stateful.rabbitmq.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: {{ .Values.namespace }}
spec:
  serviceName: rabbitmq
  replicas: {{ .Values.stateful.rabbitmq.replicas }}
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: {{ .Values.topologySpread.topologyKey }}
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: rabbitmq
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: rabbitmq
      containers:
        - name: rabbitmq
          image: {{ .Values.stateful.rabbitmq.image }}
          ports:
            - containerPort: {{ .Values.stateful.rabbitmq.port }}
            - containerPort: {{ .Values.stateful.rabbitmq.managementPort }}
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
          readinessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - ping
            initialDelaySeconds: 20
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: rabbitmq-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.stateful.rabbitmq.storageClassName | quote }}
        resources:
          requests:
            storage: {{ .Values.stateful.rabbitmq.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: {{ .Values.stateful.rabbitmq.port }}
      targetPort: {{ .Values.stateful.rabbitmq.port }}
    - name: management
      port: {{ .Values.stateful.rabbitmq.managementPort }}
      targetPort: {{ .Values.stateful.rabbitmq.managementPort }}
{{- end }}
